name: EAS Build (Mobile)

# Dispara a build do app Mobile na EAS (servidores da Expo) SEM eas-cli local.
# Pre-requisito UNICO: segredo do repositorio EXPO_TOKEN (conta sintera-health-tech).
#   Expo -> Account settings -> Access tokens -> criar token
#   GitHub -> Settings -> Secrets and variables -> Actions -> New secret: EXPO_TOKEN
# Uso: aba Actions -> "EAS Build (Mobile)" -> Run workflow ->
#   "Use workflow from" = escolher a BRANCH a buildar (ex.: feat/mobile-inc4-perfil, que tem o Ciclo 1)
#   -> plataforma android, perfil preview -> Run.
# perfil preview = APK de distribuicao interna (apps/mobile/eas.json). Build em expo.dev -> Builds.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        default: android
        options: [android, ios, all]
      profile:
        description: Perfil EAS
        type: choice
        default: preview
        options: [preview, development, production]

jobs:
  build:
    name: eas build (${{ inputs.platform }} - ${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Guard - EXPO_TOKEN presente
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Segredo EXPO_TOKEN ausente. Adicione em Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Install deps (monorepo root)
        run: npm ci

      - name: EAS Build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
