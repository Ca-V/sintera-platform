name: EAS Build (Mobile)

# Dispara a build do app Mobile na EAS (servidores da Expo) SEM eas-cli local.
# Pre-requisito UNICO: segredo do repositorio EXPO_TOKEN (conta sintera-health-tech).
#   Expo -> Account settings -> Access tokens -> criar token
#   GitHub -> Settings -> Secrets and variables -> Actions -> New secret: EXPO_TOKEN
# Uso: aba Actions -> "EAS Build (Mobile)" -> Run workflow -> Run (defaults ja buildam o Ciclo 1).
# O input `ref` decide QUAL branch e buildada (default: main, que tem o Ciclo 1 desde a #158),
# independentemente de o workflow morar na main. perfil preview = APK interno (apps/mobile/eas.json).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch a buildar (codigo)
        type: string
        default: main
      platform:
        description: Plataforma
        type: choice
        default: android
        options: [android, ios, all]
      profile:
        description: Perfil EAS
        type: choice
        default: preview
        options: [preview, development, production]

jobs:
  build:
    name: eas build (${{ inputs.platform }} - ${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (branch escolhida)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Guard - EXPO_TOKEN presente
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Segredo EXPO_TOKEN ausente. Adicione em Settings -> Secrets -> Actions."
            exit 1
          fi

      - name: Install deps (monorepo root)
        run: npm ci

      - name: EAS Build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
