# CI de qualidade — roda a cada push/PR. Protege permanentemente typecheck (web + mobile) e a suíte de testes
# (inclui os guardas de arquitetura mobile: config plugin do CMake, Home é composição, contrato de slots).
#
# Bloqueantes: typecheck (web) · typecheck (mobile) · typecheck (pacotes @sintera/*) · testes. Todos VERDES hoje.
# Informativo (não bloqueia): lint — há débito PRÉ-EXISTENTE na Web congelada (regras de hooks em
# useNovelty/useModalA11y etc.), fora do escopo de correção como "preenchimento". A triar à parte antes de
# tornar o lint bloqueante.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (mobile)
        run: npm run typecheck:mobile

      - name: Typecheck (pacotes compartilhados)
        # Fecha a lacuna: erros de tipo INTERNOS a um pacote (@sintera/*) passam despercebidos pelo tsc de
        # web/mobile (que só checa o que importam). Cada pacote é validado pelo seu próprio tsconfig.
        run: npm run typecheck:packages

      - name: Testes (web + mobile)
        run: npm test

      - name: Build da Web (integridade)
        # Env dummy: o CI verifica a INTEGRIDADE do build, não conexão. As NEXT_PUBLIC_* são inlined no
        # build; as rotas pesadas em dados são dinâmicas (ƒ), não geradas no build → não tocam o Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build
        run: npm run build

      - name: Lint (informativo — ver débito pré-existente da Web)
        run: npm run lint
        continue-on-error: true
